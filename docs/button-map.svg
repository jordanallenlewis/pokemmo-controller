<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1800 990" width="1800" height="990" font-family="'Segoe UI Variable Display','Segoe UI',Inter,system-ui,-apple-system,sans-serif">
  <!-- Source for docs/button-map.png. Controller photo: "Xbox Series Controller Carbon Black"
       by UKER, CC BY-SA 4.0, Wikimedia Commons (background removed). This image is CC BY-SA 4.0. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="52%" r="72%">
      <stop offset="0" stop-color="#3a404c"/>
      <stop offset="0.45" stop-color="#1d2129"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1800" height="990" fill="url(#bg)"/>

  <text x="64" y="84" font-size="34" font-weight="700" fill="#f2f3f5" letter-spacing="-0.3">PokeMMO on a controller</text>
  <text x="64" y="118" font-size="18" fill="#8b919c">Xbox shown · same spots on PlayStation and Switch Pro · Windows, macOS, Linux</text>

  <image href="xbox-controller.webp" xlink:href="xbox-controller.webp" x="450" y="200" width="900" height="651.5" filter="url(#shadow)"/>

  <g fill="none" stroke="#7d8696" stroke-width="1.8">
    <polyline points="392,214 600,214 640,206"/>
    <polyline points="392,322 560,322 610,262"/>
    <polyline points="392,460 560,460 640,388"/>
    <polyline points="392,620 720,620 768,560"/>
    <polyline points="840,182 840,355"/>
    <polyline points="1000,182 1000,355"/>
    <polyline points="1408,214 1200,214 1160,206"/>
    <polyline points="1408,322 1240,322 1190,262"/>
    <polyline points="1408,460 1300,460 1262,388"/>
    <polyline points="1408,660 1180,660 1112,588"/>
  </g>
  <g fill="#7dd3fc" stroke="#0c0e12" stroke-width="2.5">
    <circle cx="640" cy="206" r="6.5"/><circle cx="610" cy="262" r="6.5"/>
    <circle cx="640" cy="388" r="6.5"/><circle cx="768" cy="560" r="6.5"/>
    <circle cx="840" cy="355" r="6.5"/><circle cx="1000" cy="355" r="6.5"/>
    <circle cx="1160" cy="206" r="6.5"/><circle cx="1190" cy="262" r="6.5"/>
    <circle cx="1262" cy="388" r="6.5"/><circle cx="1112" cy="588" r="6.5"/>
  </g>

  <g text-anchor="end">
    <text x="376" y="210" font-size="22" font-weight="700" fill="#f2f3f5">LT</text>
    <text x="376" y="238" font-size="17" fill="#a8adb7">Previous hotbar page</text>
    <text x="376" y="318" font-size="22" font-weight="700" fill="#f2f3f5">LB</text>
    <text x="376" y="346" font-size="17" fill="#a8adb7">Hotbar 5</text>
    <text x="376" y="456" font-size="22" font-weight="700" fill="#f2f3f5">Left stick</text>
    <text x="376" y="484" font-size="17" fill="#a8adb7">Move · press for Team</text>
    <text x="376" y="616" font-size="22" font-weight="700" fill="#f2f3f5">D-pad</text>
    <text x="376" y="644" font-size="17" fill="#a8adb7">Hotbar ↑1  →2  ↓3  ←4</text>
  </g>

  <text x="826" y="160" font-size="22" font-weight="700" fill="#f2f3f5" text-anchor="end">View</text>
  <text x="826" y="186" font-size="17" fill="#7dd3fc" text-anchor="end">Focus Ring</text>
  <text x="1014" y="160" font-size="22" font-weight="700" fill="#f2f3f5">Menu</text>
  <text x="1014" y="186" font-size="17" fill="#a8adb7">Game Menu · Party</text>

  <text x="1424" y="210" font-size="22" font-weight="700" fill="#f2f3f5">RT</text>
  <text x="1424" y="238" font-size="17" fill="#a8adb7">Next hotbar page</text>
  <text x="1424" y="318" font-size="22" font-weight="700" fill="#f2f3f5">RB</text>
  <text x="1424" y="346" font-size="17" fill="#a8adb7">Bag</text>
  <text x="1424" y="428" font-size="17" fill="#a8adb7"><tspan font-size="20" font-weight="800" fill="#5fd16a">A</tspan>  Confirm · talk</text>
  <text x="1424" y="458" font-size="17" fill="#a8adb7"><tspan font-size="20" font-weight="800" fill="#ff5a4f">B</tspan>  Cancel · back</text>
  <text x="1424" y="488" font-size="17" fill="#a8adb7"><tspan font-size="20" font-weight="800" fill="#4aa3ff">X</tspan>  Key X</text>
  <text x="1424" y="518" font-size="17" fill="#a8adb7"><tspan font-size="20" font-weight="800" fill="#ffc83d">Y</tspan>  Key Y</text>
  <text x="1424" y="656" font-size="22" font-weight="700" fill="#f2f3f5">Right stick</text>
  <text x="1424" y="684" font-size="17" fill="#7dd3fc">Labeled wheel</text>
  <text x="1424" y="710" font-size="17" fill="#a8adb7">press for Screenshot</text>

  <g transform="translate(900 902)" text-anchor="middle">
    <text y="0" font-size="15" font-weight="700" fill="#7dd3fc" letter-spacing="1.5">RIGHT-STICK WHEEL</text>
    <text y="30" font-size="18" fill="#c4c8cf">Pokédex  ·  Egg Incubators  ·  Trainer Card  ·  Friends  ·  Global Trade Link  ·  Hotbar 6 – 9  ·  Hide GUI</text>
  </g>
  <text x="1776" y="972" font-size="12" fill="#5c6370" text-anchor="end">Controller photo: UKER, CC BY-SA 4.0, via Wikimedia Commons</text>
</svg>
