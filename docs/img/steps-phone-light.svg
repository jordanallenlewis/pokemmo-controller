<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 858" width="900" height="858" role="img" aria-labelledby="t d" font-family="'Bricolage Grotesque','Geist','Segoe UI Variable Display','Segoe UI',Inter,'SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif">
<title id="t">Install in three steps</title><desc id="d">Close PokeMMO, paste one line for your system, play from Steam.</desc>
<rect width="900" height="858" fill="#f6f3ec"/>
<rect x="30" y="30" width="840" height="250" rx="24" fill="#ffffff" stroke="#ddd8cb" stroke-width="2.5"/><circle cx="104" cy="98" r="38" fill="#ffc833"/><text x="104" y="112" font-size="42" font-weight="800" fill="#1a1408" text-anchor="middle" >1</text><text x="166" y="112" font-size="48" font-weight="750" fill="#121418" text-anchor="start" >Close PokeMMO</text><text x="66" y="186" font-size="32" font-weight="400" fill="#575c68" text-anchor="start" >Leave Steam open. The installer restarts</text><text x="66" y="228" font-size="32" font-weight="400" fill="#575c68" text-anchor="start" >it if it must, never under a running game.</text><rect x="30" y="306" width="840" height="250" rx="24" fill="#ffffff" stroke="#ddd8cb" stroke-width="2.5"/><circle cx="104" cy="374" r="38" fill="#ffc833"/><text x="104" y="388" font-size="42" font-weight="800" fill="#1a1408" text-anchor="middle" >2</text><text x="166" y="388" font-size="48" font-weight="750" fill="#121418" text-anchor="start" >Paste one line</text><text x="66" y="462" font-size="32" font-weight="400" fill="#575c68" text-anchor="start" >Your system's line from below. Nothing to</text><text x="66" y="504" font-size="32" font-weight="400" fill="#575c68" text-anchor="start" >install first, no admin rights.</text><rect x="30" y="582" width="840" height="250" rx="24" fill="#ffffff" stroke="#ddd8cb" stroke-width="2.5"/><circle cx="104" cy="650" r="38" fill="#ffc833"/><text x="104" y="664" font-size="42" font-weight="800" fill="#1a1408" text-anchor="middle" >3</text><text x="166" y="664" font-size="48" font-weight="750" fill="#121418" text-anchor="start" >Play from Steam</text><text x="66" y="738" font-size="32" font-weight="400" fill="#575c68" text-anchor="start" >Launch PokeMMO from your Steam library.</text><text x="66" y="780" font-size="32" font-weight="400" fill="#575c68" text-anchor="start" >Done in about a minute.</text>
</svg>
