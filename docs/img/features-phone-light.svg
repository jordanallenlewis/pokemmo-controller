rect x="54" y="642" width="104" height="104" rx="24" fill="#f8f6bc"/><g transform="translate(74,662) scale(2.667)" fill="none" stroke="#635f03" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></g><text x="190" y="674" font-size="40" font-weight="800" fill="#14161a" text-anchor="start" >Remap in your browser</text><text x="190" y="734" font-size="28" font-weight="400" fill="#4d535e" text-anchor="start" >Pick your controller, change any button,</text><text x="190" y="770" font-size="28" font-weight="400" fill="#4d535e" text-anchor="start" >watch the map update, press Apply. Runs</text><text x="190" y="806" font-size="28" font-weight="400" fill="#4d535e" text-anchor="start" >on your computer only.</text><rect x="24" y="900" width="852" height="270" rx="24" fill="#ffffff" stroke="#ddd8cb" stroke-width="2.5"/><rect x="54" y="934" width="104" height="104" rx="24" fill="#f8f6bc"/><g transform="translate(74,954) scale(2.667)" fill="none" stroke="#635f03" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></g><text x="190" y="966" font-size="40" font-weight="800" fill="#14161a" text-anchor="start" >Updates keep your layout</text><text x="190" y="1026" font-size="28" font-weight="400" fill="#4d535e" text-anchor="start" >Run the same command to update.</text><text x="190" y="1062" font-size="28" font-weight="400" fill="#4d535e" text-anchor="start" >Uninstall puts every file back exactly</text><text x="190" y="1098" font-size="28" font-weight="400" fill="#4d535e" text-anchor="start" >as it was.</text><rect x="24" y="1192" width="852" height="270" rx="24" fill="#ffffff" stroke="#ddd8cb" stroke-width="2.5"/><rect x="54" y="1226" width="104" height="104" rx="24" fill="#f8f6bc"/><g transform="translate(74,1246) scale(2.667)" fill="none" stroke="#635f03" stroke-width="1.5" stroke-linecap="round" stroke-line