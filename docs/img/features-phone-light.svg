<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1656" width="900" height="1656" role="img" aria-labelledby="t d" font-family="'Segoe UI Variable Display','Segoe UI',Inter,'SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif">
<title id="t">What you get</title><desc id="d">One command: Nothing to install first, no administrator rights. Uninstall puts every file back byte for byte.; Your pad, your names: Xbox, PlayStation, Switch Pro, Steam Deck and Legion Go S, each with its own button labels.; A wheel you can read: Tilt the right stick toward a slice and let go: one key press.; Change any button: A remap screen in your browser. Nothing is sent anywhere.; Allowed: PokeMMO lets you remap while one input does one thing. This layout keeps to that: no turbo, no macros.; Honest about testing: Real-hardware results are listed, and what has not been tried on a real pad says so.</desc>
<rect width="900" height="1656" fill="#f4f5fb"/>
<rect x="24" y="24" width="852" height="250" rx="24" fill="#ffffff" stroke="#cdd2e4" stroke-width="2.5"/><rect x="54" y="58" width="104" height="104" rx="24" fill="#e6e5fb"/><g transform="translate(74,78)"><rect x="4" y="10" width="56" height="44" rx="9" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 17,26 L 27,33 L 17,40 M 33,43 H 47" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="190" y="92" font-size="44" font-weight="800" fill="#141a2e" text-anchor="start" >One command</text><text x="190" y="144" font-size="31" font-weight="400" fill="#586180" text-anchor="start" >Nothing to install first, no</text><text x="190" y="184" font-size="31" font-weight="400" fill="#586180" text-anchor="start" >administrator rights. Uninstall puts</text><text x="190" y="224" font-size="31" font-weight="400" fill="#586180" text-anchor="start" >every file back byte for byte.</text><rect x="24" y="296" width="852" height="250" rx="24" fill="#ffffff" stroke="#cdd2e4" stroke-width="2.5"/><rect x="54" y="330" width="104" height="104" rx="24" fill="#e6e5fb"/><g transform="translate(74,350)"><rect x="3" y="14" width="58" height="36" rx="18" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 19,25 V 39 M 12,32 H 26" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="44" cy="27" r="2.5" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="51" cy="33" r="2.5" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="44" cy="39" r="2.5" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="190" y="364" font-size="44" font-weight="800" fill="#141a2e" text-anchor="start" >Your pad, your names</text><text x="190" y="416" font-size="31" font-weight="400" fill="#586180" text-anchor="start" >Xbox, PlayStation, Switch Pro, Steam</text><text x="190" y="456" font-size="31" font-weight="400" fill="#586180" text-anchor="start" >Deck and Legion Go S, each with its</text><text x="190" y="496" font-size="31" font-weight="400" fill="#586180" text-anchor="start" >own button labels.</text><rect x="24" y="568" width="852" height="250" rx="24" fill="#ffffff" stroke="#cdd2e4" stroke-width="2.5"/><rect x="54" y="602" width="104" height="104" rx="24" fill="#e6e5fb"/><g transform="translate(74,622)"><circle cx="32" cy="32" r="28" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="32" r="13" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 32.0,19.0 L 32.0,5.0 M 41.2,22.8 L 51.1,12.9 M 45.0,32.0 L 59.0,32.0 M 41.2,41.2 L 51.1,51.1 M 32.0,45.0 L 32.0,59.0 M 22.8,41.2 L 12.9,51.1 M 19.0,32.0 L 5.0,32.0 M 22.8,22.8 L 12.9,12.9 " fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="190" y="636" font-size="44" font-weight="800" fill="#141a2e" text-anchor="start" >A wheel you can read</text><text x="190" y="688" font-size="31" font-weight="400" fill="#586180" text-anchor="start" >Tilt the right stick toward a slice</text><text x="190" y="728" font-size="31" font-weight="400" fill="#586180" text-anchor="start" >and let go: one key press.</text><rect x="24" y="840" width="852" height="250" rx="24" fill="#ffffff" stroke="#cdd2e4" stroke-width="2.5"/><rect x="54" y="874" width="104" height="104" rx="24" fill="#e6e5fb"/><g transform="translate(74,894)"><path d="M 6,16 H 58 M 6,32 H 58 M 6,48 H 58" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="16" r="6" fill="#f4f5fb" stroke="#4338ca" stroke-width="4"/><circle cx="20" cy="32" r="6" fill="#f4f5fb" stroke="#4338ca" stroke-width="4"/><c