<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" width="1600" height="360" role="img" aria-labelledby="t d" font-family="'Segoe UI Variable Display','Segoe UI',Inter,'SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif">
<title id="t">Install in three steps</title><desc id="d">Close PokeMMO, paste one line for your system, play from Steam.</desc>
<rect width="1600" height="360" fill="#f4f5fb"/>
<rect x="60" y="40" width="490" height="280" rx="20" fill="#ffffff" stroke="#cdd2e4" stroke-width="2"/><circle cx="122" cy="108" r="30" fill="#4338ca"/><text x="122" y="119" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle" >1</text><text x="172" y="119" font-size="34" font-weight="750" fill="#141a2e" text-anchor="start" >Close PokeMMO</text><text x="96" y="178" font-size="22" font-weight="400" fill="#586180" text-anchor="start" >Leave Steam open. The installer</text><text x="96" y="210" font-size="22" font-weight="400" fill="#586180" text-anchor="start" >restarts it if it must, never under</text><text x="96" y="242" font-size="22" font-weight="400" fill="#586180" text-anchor="start" >a running game.</text><path d="M 558,180 l 28,0 m -10,-10 l 10,10 l -10,10" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="595" y="40" width="490" height="280" rx="20" fill="#ffffff" stroke="#cdd2e4" stroke-width="2"/><circle cx="657" cy="108" r="30" fill="#4338ca"/><text x="657" y="119" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle" >2</text><text x="707" y="119" font-size="34" font-weight="750" fill="#141a2e" text-anchor="start" >Paste one line</text><text x="631" y="178" font-size="22" font-weight="400" fill="#586180" text-anchor="start" >Your system's line from below.</text><text x="631" y="210" font-size="22" font-weight="400" fill="#586180" text-anchor="start" >Nothing to install first, no admin</text><text x="631" y="242" font-size="22" font-weight="400" fill="#586180" text-anchor="start" >rights.</text><path d="M 1093,180 l 28,0 m -10,-10 l 10,10 l -10,10" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1130" y="40" width="490" height="280" rx="20" fill="#ffffff" stroke="#cdd2e4" stroke-width="2"/><circle cx="1192" cy="108" r="30" fill="#4338ca"/><text x="1192" y="119" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle" >3</text><text x="1242" y="119" font-size="34" font-weight="750" fill="#141a2e" text-anchor="start" >Play from Steam</text><text x="1166" y="178" font-size="22" font-weight="400" fill="#586180" text-anchor="start" >Launch PokeMMO from your Steam</text><text x="1166" y="210" font-size="22" font-weight="400" fill="#586180" text-anchor="start" >library. Done in about a minute.</text>
</svg>
