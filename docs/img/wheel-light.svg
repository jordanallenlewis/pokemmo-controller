<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" role="img" aria-labelledby="t d" font-family="'Segoe UI Variable Display','Segoe UI',Inter,'SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif">
<title id="t">The right-stick wheel</title><desc id="d">Eleven slices clockwise from the top. The top slice does nothing. Then Pokédex, Egg Incubators, Trainer Card, Friends, Global Trade Link, Hotbar 6, Hotbar 7, Hotbar 8, Hotbar 9, Hide GUI. Letting go in the centre cancels.</desc>
