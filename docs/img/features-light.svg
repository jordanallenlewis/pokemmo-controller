<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" role="img" aria-labelledby="t d" font-family="'Segoe UI Variable Display','Segoe UI',Inter,'SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif">
<title id="t">What you get</title><desc id="d">One command: Nothing to install first, no administrator rights. Uninstall puts every file back byte for byte.; Your pad, your names: Xbox, PlayStation, Switch Pro, Steam Deck and Legion Go S, each with its own button labels.; A wheel you can read: Tilt the right stick toward a slice and let go: one key press.; Change any button: A remap screen in your browser. Nothing is sent anywhere.; Allowed: PokeMMO lets you remap while one input does one thing. This layout keeps to that: no turbo, no macros.; Honest about testing: Real-hardware results are listed, and what has not been tried on a real pad says so.</desc>
