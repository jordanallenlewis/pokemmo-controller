<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" width="1600" height="780" role="img" aria-labelledby="t d" font-family="'Bricolage Grotesque','Geist','Segoe UI Variable Display','Segoe UI',Inter,'SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif">
<title id="t">What you get</title><desc id="d">The game's own controller support: Your binds go straight into PokeMMO's settings. Nothing sits between your controller and the game.; Within PokeMMO's rules: One input does one thing. No turbo, no macros, no sequences, and the tool refuses any layout that tries.; Remap in your browser: Pick your controller, change any button, watch the map update, press Apply. Runs on your computer only.; Updates keep your layout: Run the same command to update. Uninstall puts every file back exactly as it was.; Finds the game by itself: Windows, the macOS app, the Linux zip, Flatpak and Snap. No settings to hunt for, no admin rights.; Your whole hotbar: Slots 1-4 on the D-pad, slot 5 on View (which also opens the town map), 6-9 on the wheel, and the Focus Ring on LB to reach any item.</desc>
<rect width="1600" height="780" fill="#f6f3ec"/>
