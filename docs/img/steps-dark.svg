<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" width="1600" height="360" role="img" aria-labelledby="t d" font-family="'Segoe UI Variable Display','Segoe UI',Inter,'SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif">
<title id="t">Install in three steps</title><desc id="d">Close PokeMMO, paste one line for your system, play from Steam.</desc>
<rect width="1600" height="360" fill="#0e1122"/>
<rect x="60" y="40" width="470" height="280" rx="20" fill="#171b33" stroke="#2c3358" stroke-width="2"/><circle cx="122" cy="108" r="30" fill="#9a9cff"/><text x="122" y="119" font-size="32" font-weight="800" fill="#0e1122" text-anchor="middle" >1</text><text x="172" y="119" font-size="34" font-weight="750" fill="#eef0fb" text-anchor="start" >Close PokeMMO</text><text x="96" y="178" font-size="22" font-weight="400" fill="#9aa3c4" text-anchor="start" >Leave Steam open. The installer</text><text x="96" y="210" font-size="22" font-weight="400" fill="#9aa3c4" text-anchor="start" >restarts it if it must, never under</text><text x="96" y="242" font-size="22" font-weight="400" fill="#9aa3c4" text-anchor="start" >a running game.</text><path d="M 538,180 l 28,0 m -10,-10 l 10,10 l -10,10" fill="none" stroke="#9a9cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="572" y="40" width="470" height="280" rx="20" fill="#171b33" stroke="#2c3358" stroke-width="2"/><circle cx="634" cy="108" r="30" fill="#9a9cff"/><text x="634" y="119" font-size="32" font-weight="800" fill="#0e1122" text-anchor="middle" >2</text><text x="684" y="119" font-size="34" font-weight="750" fill="#eef0fb" text-anchor="start" >Paste one line</text><text x="608" y="178" font-size="22" font-weight="400" fill="#9aa3c4" text-anchor="start" >Your system's line from below.</text><text x="608" y="210" font-size="22" font-weight="400" fill="#9aa3c4" text-anchor="start" >Nothing to install first, no admin</text><text x="608" y="242" font-size="22" font-weight="400" fill="#9aa3c4" text-anchor="start" >rights.</text><path d="M 1050,180 l 28,0 m -10,-10 l 10,10 l -10,10" fill="none" stroke="#9a9cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1084" y="40" width="470" height="280" rx="20" fill="#171b33" stroke="#2c3358" stroke-width="2"/><circle cx="1146" cy="108" r="30" fill="#9a9cff"/><text x="1146" y="119" font-size="32" font-weight="800" fill="#0e1122" text-anchor="middle" >3</text><text x="1196" y="119" font-size="34" font-weight="750" fill="#eef0fb" text-anchor="start" >Play from Steam</text><text x="1120" y="178" font-size="22" font-weight="400" fill="#9aa3c4" text-anchor="start" >Launch PokeMMO from your Steam</text><text x="1120" y="210" font-size="22" font-weight="400" fill="#9aa3c4" text-anchor="start" >library. Done in about a minute.</text>
</svg>
