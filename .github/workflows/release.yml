name: release assets

# When a release is published, attach the files the installers download:
# pokemmo-controller.tar.gz (macOS, Linux), pokemmo-controller.zip (Windows) and
# SHA256SUMS. Downloads of these files are the install count (GitHub counts them;
# nothing is collected from players). A pre-release gets the same files, but the
# installers only follow the newest full release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build assets for, e.g. v1.2.0"
        required: true

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Build
        run: |
          set -eu
          mkdir -p dist
          git archive --format=tar.gz --prefix="pokemmo-controller-${TAG}/" -o dist/pokemmo-controller.tar.gz HEAD
          git archive --format=zip --prefix="pokemmo-controller-${TAG}/" -o dist/pokemmo-controller.zip HEAD
          (cd dist && sha256sum pokemmo-controller.tar.gz pokemmo-controller.zip > SHA256SUMS && cat SHA256SUMS)
      - name: Attach to the release
        run: gh release upload "$TAG" dist/pokemmo-controller.tar.gz dist/pokemmo-controller.zip dist/SHA256SUMS --clobber
