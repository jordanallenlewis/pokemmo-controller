name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest  # no Python 3.9 build for its Ubuntu release
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the upgrade tests install older releases from git history
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Extra shells
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends dash zsh busybox
      - name: Sandbox tests (install, update, uninstall, both installers)
        env:
          POKEMMO_CONTROLLER_NETWORK_TESTS: "1"  # also test the no-Python path (downloads uv)
        run: python -m unittest discover -s tests -v
